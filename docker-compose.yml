version: '3.9'

services:
  web:
    build: .
    volumes:
      - .:/app:cached
    ports:
      - "8002:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=gotopa_project.settings
      - DATABASE_PATH=/app/db.sqlite3
    command: python manage.py runserver 0.0.0.0:8000
