{% extends 'main/base.html' %}
{% load static %}

{% block title %}Худалдан авалт бүртгэх - Готопа{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-secondary">Худалдан авалт бүртгэх</h1>
            <a href="{% url 'main:stock_movement_list' %}" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                ← Буцах
            </a>
        </div>

        <form method="POST" class="bg-white shadow-md rounded-lg p-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Огноо -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Огноо <span class="text-red-500">*</span>
                    </label>
                    <input type="date" name="transaction_date" required value="{% now 'Y-m-d' %}"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <!-- Бараа -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Бараа <span class="text-red-500">*</span>
                    </label>
                    <select name="product" id="productSelect" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">-- Сонгоно уу --</option>
                        {% for product in products %}
                            <option value="{{ product.id|stringformat:'d' }}" 
                                    data-purchase-price="{{ product.purchase_price }}"
                                    data-stock="{{ product.current_stock }}">
                                {{ product.name }} (Үлдэгдэл: {{ product.current_stock }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Тоо ширхэг -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Тоо ширхэг <span class="text-red-500">*</span>
                    </label>
                    <input type="number" name="quantity" id="quantityInput" required min="1" value="1"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <!-- Нэгж үнэ -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Нэгж үнэ <span class="text-red-500">*</span>
                    </label>
                    <input type="number" name="price" id="priceInput" required min="0" step="0.01"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>

                <!-- Төлбөрийн хэлбэр -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Төлбөрийн хэлбэр <span class="text-red-500">*</span>
                    </label>
                    <select name="payment_method" id="paymentMethod" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">-- Сонгоно уу --</option>
                        {% for code, label in payment_methods %}
                            <option value="{{ code }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Касс -->
                <div id="cashAccountField" style="display: none;">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Касс <span class="text-red-500">*</span>
                    </label>
                    <select name="bank_account" id="cashAccountSelect"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">-- Сонгоно уу --</option>
                        {% for account in cash_accounts %}
                            <option value="{{ account.id|stringformat:'d' }}">{{ account.code }} - {{ account.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Банк -->
                <div id="bankAccountField" style="display: none;">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Банкны данс <span class="text-red-500">*</span>
                    </label>
                    <select name="bank_account" id="bankAccountSelect"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">-- Сонгоно уу --</option>
                        {% for account in bank_accounts %}
                            <option value="{{ account.id|stringformat:'d' }}">{{ account.code }} - {{ account.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Нийлүүлэгч -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Нийлүүлэгч <span id="supplierRequired" class="text-red-500" style="display:none;">*</span>
                    </label>
                    <select name="counterparty" id="supplierSelect"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="">-- Сонгоно уу --</option>
                        {% for supplier in suppliers %}
                            <option value="{{ supplier.id|stringformat:'d' }}">{{ supplier.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Нийт дүн -->
            <div class="mt-6 p-4 bg-blue-50 rounded-lg">
                <div class="flex justify-between items-center text-lg font-bold">
                    <span>Нийт дүн:</span>
                    <span id="totalAmount" class="text-primary">0₮</span>
                </div>
            </div>

            <!-- Тэмдэглэл -->
            <div class="mt-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Тэмдэглэл</label>
                <textarea name="notes" rows="3"
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
            </div>

            <!-- Товчнууд -->
            <div class="mt-6 flex gap-4">
                <button type="submit" class="flex-1 bg-primary text-white px-6 py-3 rounded-lg hover:bg-opacity-90 font-semibold">
                    ✓ Хадгалах
                </button>
                <a href="{% url 'main:stock_movement_list' %}" class="flex-1 text-center bg-gray-300 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-400 font-semibold">
                    Цуцлах
                </a>
            </div>
        </form>
    </div>
</div>

<script>
const productSelect = document.getElementById('productSelect');
const quantityInput = document.getElementById('quantityInput');
const priceInput = document.getElementById('priceInput');
const totalAmount = document.getElementById('totalAmount');
const paymentMethod = document.getElementById('paymentMethod');
const cashAccountField = document.getElementById('cashAccountField');
const cashAccountSelect = document.getElementById('cashAccountSelect');
const bankAccountField = document.getElementById('bankAccountField');
const bankAccountSelect = document.getElementById('bankAccountSelect');
const supplierSelect = document.getElementById('supplierSelect');
const supplierRequired = document.getElementById('supplierRequired');

// Бараа сонгох үед үнэ автоматаар гарна
productSelect.addEventListener('change', function() {
    const selected = this.options[this.selectedIndex];
    if (selected.value) {
        const purchasePrice = selected.getAttribute('data-purchase-price');
        priceInput.value = purchasePrice;
        calculateTotal();
    }
});

// Нийт дүн тооцоолох
function calculateTotal() {
    const quantity = parseFloat(quantityInput.value) || 0;
    const price = parseFloat(priceInput.value) || 0;
    const total = quantity * price;
    totalAmount.textContent = total.toLocaleString() + '₮';
}

quantityInput.addEventListener('input', calculateTotal);
priceInput.addEventListener('input', calculateTotal);

// Төлбөрийн хэлбэр сонгох
paymentMethod.addEventListener('change', function() {
    const value = this.value;
    
    if (value === 'CASH') {
        cashAccountField.style.display = 'block';
        bankAccountField.style.display = 'none';
        if (cashAccountSelect) cashAccountSelect.required = true;
        if (bankAccountSelect) bankAccountSelect.required = false;
        supplierSelect.required = false;
        supplierRequired.style.display = 'none';
    } else if (value === 'BANK') {
        cashAccountField.style.display = 'none';
        bankAccountField.style.display = 'block';
        if (cashAccountSelect) cashAccountSelect.required = false;
        if (bankAccountSelect) bankAccountSelect.required = true;
        supplierSelect.required = false;
        supplierRequired.style.display = 'none';
    } else if (value === 'CREDIT') {
        cashAccountField.style.display = 'none';
        bankAccountField.style.display = 'none';
        if (cashAccountSelect) cashAccountSelect.required = false;
        if (bankAccountSelect) bankAccountSelect.required = false;
        supplierSelect.required = true;
        supplierRequired.style.display = 'inline';
    } else {
        cashAccountField.style.display = 'none';
        bankAccountField.style.display = 'none';
        if (cashAccountSelect) cashAccountSelect.required = false;
        if (bankAccountSelect) bankAccountSelect.required = false;
        supplierSelect.required = false;
        supplierRequired.style.display = 'none';
    }
});
</script>
{% endblock %}
