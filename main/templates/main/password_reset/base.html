{% load static %}
<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Нууц үг сэргээх{% endblock %} - Готопа бясалгалын төв</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .input-focus:focus {
            border-color: #AB334C;
            box-shadow: 0 0 0 3px rgba(181, 36, 91, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full mx-auto" style="max-width: 400px;">
        <div class="text-center mb-4">
            <div class="inline-block bg-white rounded-full p-1.5 shadow-lg mb-2">
                <img src="{% static 'images/gotopa_logo.jpg' %}" alt="Готопа" class="h-10 w-10 rounded-full">
            </div>
            <h1 class="text-xl font-bold text-white mb-1">{% block heading %}Нууц үг сэргээх{% endblock %}</h1>
            <p class="text-purple-100 text-sm">Готопа бясалгалын төв</p>
        </div>

        <div class="bg-white rounded-xl shadow-xl p-8">
            {% block content %}{% endblock %}
        </div>

        <div class="text-center mt-5">
            <a href="{% url 'main:login' %}" class="text-white hover:text-purple-100 text-sm">
                ← Нэвтрэх хуудас
            </a>
        </div>
    </div>
</body>
</html>
