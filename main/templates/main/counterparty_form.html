{% extends 'main/base.html' %}
{% load static %}

{% block title %}{% if is_edit %}Харилцагч засах{% else %}Харилцагч бүртгэх{% endif %} - Готопа{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-secondary mb-6">
            {% if is_edit %}✏️ Харилцагч засах{% else %}➕ Харилцагч бүртгэх{% endif %}
        </h1>

        <form method="POST">
            {% csrf_token %}
            
            <div class="space-y-4">
                <!-- Нэр -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Харилцагчийн нэр <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="name" value="{{ counterparty.name }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Төрөл -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Төрөл <span class="text-red-500">*</span>
                    </label>
                    <select name="counterparty_type" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                        {% for value, label in type_choices %}
                        <option value="{{ value }}" {% if counterparty.counterparty_type == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Холбоо барих хүн -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Холбоо барих хүн
                    </label>
                    <input type="text" name="contact_person" value="{{ counterparty.contact_person }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Утас -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Утас
                    </label>
                    <input type="text" name="phone" value="{{ counterparty.phone }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Имэйл -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Имэйл
                    </label>
                    <input type="email" name="email" value="{{ counterparty.email }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Хаяг -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Хаяг
                    </label>
                    <textarea name="address" rows="2"
                              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">{{ counterparty.address }}</textarea>
                </div>

                <!-- Регистрийн дугаар -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Регистрийн дугаар
                    </label>
                    <input type="text" name="registration_number" value="{{ counterparty.registration_number }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Татварын дугаар -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Татварын дугаар
                    </label>
                    <input type="text" name="tax_number" value="{{ counterparty.tax_number }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
            </div>

            <!-- Товчнууд -->
            <div class="flex gap-3 mt-6">
                <button type="submit" class="flex-1 bg-primary text-white px-4 py-2 rounded-lg hover:bg-opacity-90">
                    <i class="fas fa-save mr-2"></i>Хадгалах
                </button>
                <a href="{% url 'main:counterparty_list' %}" class="flex-1 bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 text-center">
                    <i class="fas fa-times mr-2"></i>Болих
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
